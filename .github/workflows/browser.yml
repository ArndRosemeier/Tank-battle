name: Browser smoke
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version number is counted from git history (scripts/buildInfo.ts)
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install --prefix .browser-smoke --no-save playwright@1.58.2
      - run: npx --prefix .browser-smoke playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
