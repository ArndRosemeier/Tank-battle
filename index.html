<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Tank Battle</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #error {
        position: fixed;
        inset-inline: 0;
        top: 0;
        padding: 0.75rem 1rem;
        background: crimson;
        color: white;
        font-size: 0.875rem;
        white-space: pre-wrap;
        display: none;
        z-index: 2;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
        z-index: 3;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-shadow: 0 0 8px currentColor;
        --panel-bg: rgba(2, 10, 14, 0.8);
        --panel-line: rgba(143, 244, 255, 0.32);
      }
      .hud-panel {
        position: absolute;
        display: grid;
        gap: 8px;
        padding: 13px 17px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-line);
        border-left: 2px solid currentColor;
        clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
      }
      #hud-player { left: 28px; bottom: 28px; width: 348px; }
      #hud-squad { left: 28px; top: 28px; width: 348px; display: none; }
      #hud-target { right: 28px; top: 28px; width: 276px; text-align: right; border-left: 0; border-right: 2px solid currentColor; }
      #hud-feed { right: 28px; bottom: 86px; width: 348px; display: none; border-left: 0; border-right: 2px solid currentColor; }
      #hud-fps { position: fixed; right: 30px; bottom: 30px; opacity: 0.55; font-size: 11px; text-align: right; }
      .hud-label { opacity: 0.62; font-size: 10px; letter-spacing: 0.2em; }
      .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .hud-value { font-size: 15px; opacity: 0.92; letter-spacing: 0.08em; }
      .hp-bar { display: flex; gap: 5px; }
      .hp-seg { width: 44px; height: 10px; background: currentColor; opacity: 0.14; }
      .hp-seg.live { opacity: 0.95; box-shadow: 0 0 10px currentColor; }
      .reload-row { display: flex; align-items: center; gap: 12px; }
      #hud-reload { width: 56px; height: 56px; display: block; transform: rotate(-90deg); flex: none; }
      #hud-reload-track { fill: none; stroke: currentColor; opacity: 0.16; stroke-width: 1.6; }
      #hud-reload-arc { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: butt; }
      #hud-reload-label { font-size: 13px; letter-spacing: 0.18em; }
      #hud-reload-value { font-size: 11px; opacity: 0.62; }
      #hud-squad-list { display: grid; gap: 6px; }
      .squad-row { display: grid; grid-template-columns: 104px 1fr 44px; align-items: center; gap: 10px; }
      .squad-row.dead { opacity: 0.38; }
      .squad-name { font-size: 13px; opacity: 0.95; }
      .squad-hp { display: flex; gap: 4px; }
      .squad-hp .hp-seg { width: 26px; height: 8px; }
      .squad-state { font-size: 11px; text-align: right; opacity: 0.8; }
      #hud-target .hp-seg { width: 34px; height: 8px; }
      #hud-feed-list { display: grid; gap: 5px; }
      .feed-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 12px; }
      .feed-bar { width: 3px; height: 15px; background: currentColor; opacity: 0.9; }
      .feed-killer { opacity: 0.92; }
      .feed-arrow { opacity: 0.55; }
      .feed-victim { opacity: 0.92; }
      .feed-cause { font-size: 10px; opacity: 0.55; min-width: 52px; text-align: right; }
      #hud-banner {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translate(-50%, -50%);
        padding: 18px 34px;
        border: 1px solid currentColor;
        background: rgba(1, 7, 10, 0.82);
        font-size: 30px;
        letter-spacing: 0.32em;
        display: none;
        white-space: nowrap;
        text-shadow: 0 0 18px currentColor;
      }
      #damage-vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: 2;
        background: radial-gradient(ellipse at center, rgba(255, 47, 74, 0) 42%, rgba(255, 47, 74, 0.55) 100%);
      }
      #aim-reticle {
        position: fixed;
        left: 0;
        top: 0;
        width: 42px;
        height: 42px;
        display: none;
        pointer-events: none;
        z-index: 4;
        color: #00e5ff;
        filter: drop-shadow(0 0 6px currentColor);
        transform: translate(-50%, -50%);
      }
      #aim-reticle.offscreen { opacity: 0.55; transform: translate(-50%, -50%) scale(0.78); }
      #aim-edge {
        position: fixed;
        left: 0;
        top: 0;
        width: 26px;
        height: 26px;
        display: none;
        pointer-events: none;
        z-index: 4;
        color: #00e5ff;
        opacity: 0.95;
        filter: drop-shadow(0 0 7px currentColor);
      }
      #top-legend {
        position: fixed;
        left: 18px;
        bottom: 18px;
        display: none;
        z-index: 1;
        color: #dffcff;
        font-size: 11px;
        letter-spacing: 0.12em;
        line-height: 1.65;
        text-transform: uppercase;
        background: rgba(0, 0, 0, 0.72);
        border-left: 1px solid currentColor;
        padding: 10px 14px;
        pointer-events: none;
      }
      #top-legend h2 {
        margin: 0 0 4px;
        font-size: 13px;
        letter-spacing: 0.22em;
        font-weight: normal;
        color: currentColor;
      }
      #top-legend .intent {
        max-width: 46ch;
        opacity: 0.65;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: none;
        line-height: 1.45;
        margin-bottom: 5px;
      }
      .legend-row { display: flex; align-items: center; gap: 7px; }
      .legend-swatch {
        display: inline-block;
        width: 12px;
        height: 5px;
        background: currentColor;
      }
      .spawn-swatch { display: inline-block; width: 10px; height: 10px; border: 1px solid currentColor; }
      #hud-banner {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        padding: 12px 24px;
        border: 1px solid currentColor;
        background: rgba(0, 0, 0, 0.72);
        font-size: 22px;
        letter-spacing: 0.28em;
        display: none;
        white-space: nowrap;
        text-shadow: 0 0 14px currentColor;
      }
    </style>
  </head>
  <body>
    <canvas id="app" aria-label="Tank Battle game field"></canvas>
    <div id="hud" aria-live="off">
      <div id="hud-player" class="hud-panel">
        <div class="hud-row">
          <span class="hud-label">HULL</span>
          <span id="hud-player-hp-label" class="hud-value">3 / 3</span>
        </div>
        <div id="hud-player-hp" class="hp-bar"></div>
        <div class="reload-row">
          <svg id="hud-reload" viewBox="0 0 30 30" aria-hidden="true">
            <circle id="hud-reload-track" cx="15" cy="15" r="12"></circle>
            <circle id="hud-reload-arc" cx="15" cy="15" r="12"></circle>
          </svg>
          <div>
            <div id="hud-reload-label">READY</div>
            <div id="hud-reload-value">GUN READY</div>
          </div>
        </div>
      </div>
      <div id="hud-squad" class="hud-panel">
        <div class="hud-label">SQUAD</div>
        <div id="hud-squad-list"></div>
      </div>
      <div id="hud-target" class="hud-panel">
        <div class="hud-row">
          <span class="hud-label">TARGET</span>
          <span id="hud-target-state" class="hud-label">ACTIVE</span>
        </div>
        <div id="hud-target-hp" class="hp-bar"></div>
      </div>
      <div id="hud-feed" class="hud-panel">
        <div class="hud-label">KILL FEED</div>
        <div id="hud-feed-list"></div>
      </div>
      <div id="hud-fps"></div>
      <div id="hud-banner" role="status"></div>
    </div>
    <div id="damage-vignette" aria-hidden="true"></div>
    <div id="aim-reticle" aria-hidden="true">
      <svg viewBox="0 0 42 42" width="42" height="42">
        <circle cx="21" cy="21" r="14" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
        <circle cx="21" cy="21" r="2" fill="currentColor"></circle>
        <path d="M21 1v8M21 33v8M1 21h8M33 21h8" stroke="currentColor" stroke-width="1.6"></path>
      </svg>
    </div>
    <div id="aim-edge" aria-hidden="true">
      <svg viewBox="0 0 26 26" width="26" height="26">
        <path d="M3 13 L22 4 L17 13 L22 22 Z" fill="currentColor"></path>
      </svg>
    </div>
    <div id="top-legend">
      <h2 id="top-title"></h2>
      <div id="top-intent" class="intent"></div>
      <div class="legend-row"><span class="legend-swatch" id="legend-wall"></span> TALL WALL / PILLAR</div>
      <div class="legend-row"><span class="legend-swatch" id="legend-low"></span> LOW COVER (~1.2 M, SHOOT-OVER)</div>
      <div class="legend-row"><span class="legend-swatch" id="legend-objective"></span> BREAKABLE CENTRAL OBJECTIVE</div>
      <div class="legend-row"><span class="legend-swatch" id="legend-exit"></span> SCREENED SPAWN EXIT</div>
      <div class="legend-row">SPAWN ZONES <span id="top-swatches"></span></div>
    </div>
    <div id="error" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
