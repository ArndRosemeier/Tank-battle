<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Tank Battle</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1117;
        color: #e6edf3;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #error {
        position: fixed;
        inset-inline: 0;
        top: 0;
        padding: 0.75rem 1rem;
        background: #b62324;
        color: #fff;
        font-size: 0.875rem;
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app" aria-label="Tank Battle game field"></canvas>
    <div id="error" role="alert"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
